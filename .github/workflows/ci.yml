name: C++17 CI Build & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    name: Build & Test (Ubuntu Linux - GCC)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Verify Compiler Version
      run: |
        g++ --version

    - name: Compile Modular Project (C++17)
      run: |
        g++ -std=c++17 -Wall -Wextra -Iinclude main.cpp src/EmailNotification.cpp src/SMSNotification.cpp src/SoloRegistration.cpp src/SquadRegistration.cpp src/RegistrationManager.cpp -o campus_esports

    - name: Compile Unified Single-File Project (Case Study Benchmark)
      run: |
        g++ -std=c++17 -Wall -Wextra campus_esports_unified.cpp -o campus_esports_unified

    - name: Execute Non-Interactive Batch Verification
      run: |
        ./campus_esports --demo
        ./campus_esports_unified

    - name: Test Automated Interactive Piped Session
      run: |
        printf "1\nLatheesh_Solo\n2\nVIT_Strikers\n3\n4\n5\n6\n7\n8\n" | ./campus_esports

  build-windows:
    name: Build & Test (Windows - MinGW)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSYS2 MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc

    - name: Compile Modular Project
      shell: msys2 {0}
      run: |
        g++ --version
        g++ -std=c++17 -Wall -Wextra -Iinclude main.cpp src/EmailNotification.cpp src/SMSNotification.cpp src/SoloRegistration.cpp src/SquadRegistration.cpp src/RegistrationManager.cpp -o campus_esports.exe

    - name: Compile Unified Project
      shell: msys2 {0}
      run: |
        g++ -std=c++17 -Wall -Wextra campus_esports_unified.cpp -o campus_esports_unified.exe

    - name: Run Windows Verification
      shell: msys2 {0}
      run: |
        ./campus_esports.exe --demo
        ./campus_esports_unified.exe
